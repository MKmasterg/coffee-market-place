{% extends 'base.html' %}

{% block title %}Place order{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Your basket</h1>
    <p>Review items and send your order to the seller.</p>
</div>

<form method="POST">
    {% csrf_token %}
    <div class="stock-list">
        {% for stock in stocks %}
        <div class="stock-item">
            <div class="stock-info">
                <strong>{{ stock }}</strong>
                <small>{{ stock.market }}</small>
                <span class="stock-price">{{ stock.ppg }} / g</span>
            </div>
            <div style="flex: 1; min-width: 12rem; max-width: 20rem;">
                <p>
                    <label for="id_stock{{ stock.id }}">Quantity</label>
                    <input type="number" name="stock{{ stock.id }}" required id="id_stock{{ stock.id }}" min="1">
                </p>
                <p>
                    <label for="id_stock_msg{{ stock.id }}">Message for seller</label>
                    <input type="text" name="msg{{ stock.id }}" id="id_stock_msg{{ stock.id }}" placeholder="Grind preference, notes…">
                </p>
                <a href="{% url 'users:remove_from_basket' stock.id %}" class="btn btn-ghost btn-sm">Remove</a>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Place order</button>
        <a href="{% url 'users:customer_pf' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
